server {
    listen 80;
    server_name devkobe24.com; # 본인 도메인으로 변경
    server_tokens off;

    # Certbot 인증을 위한 경로 (이게 있어야 SSL 발급 가능)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 그 외 모든 요청은 HTTPS로 리다이렉트 (SSL 발급 전엔 주석 처리 추천)
    # location / {
    #     return 301 https://$host$request_uri;
    # }
    
    # [임시] SSL 발급 전에는 HTTP로 바로 접속되게 설정
    location / {
        proxy_pass http://blog-app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
