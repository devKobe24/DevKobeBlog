<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/head :: headFragment}"></head>
  <body class="bg-white min-h-screen">
    <nav th:replace="~{fragments/nav :: navFragment}"></nav>

    <header class="bg-gray-50 border-b">
      <div class="container mx-auto px-4 py-16 max-w-4xl text-center">
        <div
          class="mb-4 text-sm text-gray-500"
          th:text="${#temporals.format(post.publishedAt, 'yyyy년 MM월 dd일')}"
        ></div>
        <h1
          class="text-3xl md:text-5xl font-bold text-gray-900 mb-6 leading-tight"
          th:text="${post.title}"
        >
          Title
        </h1>

        <div class="flex justify-center gap-2">
          <span
            class="px-3 py-1 bg-blue-100 text-blue-800 rounded-full text-sm font-medium"
            >Java</span
          >
          <span
            class="px-3 py-1 bg-green-100 text-green-800 rounded-full text-sm font-medium"
            >Spring Boot</span
          >
        </div>
      </div>
    </header>

    <main class="container mx-auto px-4 py-12 max-w-4xl">
      <div
        th:if="${post.thumbnail}"
        class="mb-10 rounded-xl overflow-hidden shadow-lg"
      >
        <img
          th:src="${post.thumbnail}"
          class="w-full object-cover max-h-[500px]"
          alt="Cover Image"
        />
      </div>

      <article
        class="prose prose-slate lg:prose-lg max-w-none prose-headings:font-bold prose-a:text-primary prose-img:rounded-xl prose-pre:bg-[#2d2d2d]"
        th:utext="${post.content}"
      ></article>

      <div class="mt-16 pt-8 border-t">
        <a href="/" class="text-primary hover:underline">← 목록으로 돌아가기</a>
      </div>
    </main>

    <footer class="bg-gray-900 text-gray-400 py-6 text-center mt-20">
      <p>© 2024 DevBlog. All rights reserved.</p>
    </footer>

    <div th:replace="~{fragments/script :: scriptFragment}"></div>
  </body>
</html>
