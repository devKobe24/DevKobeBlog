<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/head :: headFragment}"></head>
  <body class="bg-gray-50 flex flex-col min-h-screen">
    <nav th:replace="~{fragments/nav :: navFragment}"></nav>

    <main class="container mx-auto px-4 py-10 flex-grow">
      <div class="flex flex-col lg:flex-row gap-8">
        <div class="w-full lg:w-3/4">
          <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <div
              th:each="post : ${posts}"
              class="bg-white rounded-xl shadow-sm hover:shadow-md transition duration-300 overflow-hidden border border-gray-100 flex flex-col"
            >
              <a
                th:href="@{/posts/{id}(id=${post.id})}"
                class="block h-48 overflow-hidden bg-gray-200"
              >
                <img
                  th:if="${post.thumbnail}"
                  th:src="${post.thumbnail}"
                  class="w-full h-full object-cover transform hover:scale-105 transition duration-500"
                  alt="thumbnail"
                />
                <div
                  th:unless="${post.thumbnail}"
                  class="w-full h-full flex items-center justify-center text-gray-400"
                >
                  <span class="text-4xl">☕</span>
                </div>
              </a>

              <div class="p-6 flex flex-col flex-grow">
                <div class="text-sm text-gray-500 mb-2">
                  <span
                    th:text="${#temporals.format(post.publishedAt, 'yyyy-MM-dd')}"
                    >2024-01-01</span
                  >
                </div>

                <a th:href="@{/posts/{id}(id=${post.id})}" class="block mb-3">
                  <h2
                    class="text-xl font-bold text-gray-800 line-clamp-2 hover:text-primary transition"
                    th:text="${post.title}"
                  >
                    Title
                  </h2>
                </a>

                <div class="mt-4 flex flex-wrap gap-2">
                  <a
                    th:each="tag : ${post.tags}"
                    th:href="@{/(tag=${tag.name})}"
                    class="text-xs font-medium bg-gray-100 text-gray-600 px-2 py-1 rounded hover:bg-gray-200"
                    th:text="'#' + ${tag.name}"
                    >#Java</a
                  >
                </div>

                <div
                  class="mt-auto pt-4 flex items-center justify-between border-t border-gray-50"
                >
                  <span
                    class="text-xs font-semibold text-primary bg-blue-50 px-2 py-1 rounded"
                    th:text="${post.category != null ? post.category.name : 'Uncategorized'}"
                    >Backend</span
                  >
                  <a
                    th:href="@{/posts/{id}(id=${post.id})}"
                    class="text-sm text-gray-600 hover:text-black"
                    >Read More →</a
                  >
                </div>
              </div>
            </div>
          </div>

          <div
            th:if="${posts.totalPages > 0}"
            class="mt-12 flex justify-center space-x-2"
          >
            <a
              th:if="${posts.hasPrevious()}"
              th:href="@{/(page=${posts.number - 1})}"
              class="px-4 py-2 bg-white border rounded hover:bg-gray-100"
              >Prev</a
            >
            <span
              class="px-4 py-2 text-gray-600"
              th:text="${posts.number + 1} + ' / ' + ${posts.totalPages}"
              >1 / 5</span
            >
            <a
              th:if="${posts.hasNext()}"
              th:href="@{/(page=${posts.number + 1})}"
              class="px-4 py-2 bg-white border rounded hover:bg-gray-100"
              >Next</a
            >
          </div>
        </div>
        <aside class="w-full lg:w-1/4 px-4">
          <div class="bg-white p-6 rounded-xl shadow-sm border mb-8">
            <h3 class="font-bold text-gray-800 mb-4 border-b pb-2">
              Categories
            </h3>
            <ul class="space-y-2">
              <li th:each="cat : ${categories}">
                <a
                  th:href="@{/(category=${cat.name})}"
                  class="flex justify-between items-center text-gray-600 hover:text-primary"
                >
                  <span th:text="${cat.name}">Java</span>
                  <span
                    class="text-xs bg-gray-100 px-2 py-1 rounded-full"
                    th:text="${cat.posts.size()}"
                    >5</span
                  >
                </a>
              </li>
            </ul>
          </div>

          <div class="bg-white p-6 rounded-xl shadow-sm border">
            <h3 class="font-bold text-gray-800 mb-4 border-b pb-2">Tags</h3>
            <div class="flex flex-wrap gap-2">
              <a
                th:each="t : ${tags}"
                th:href="@{/(tag=${t.name})}"
                class="text-xs bg-gray-100 hover:bg-gray-200 text-gray-600 px-2 py-1 rounded"
                th:text="'#' + ${t.name}"
                >#Tag</a
              >
            </div>
          </div>
        </aside>
      </div>
    </main>

    <footer class="bg-gray-900 text-gray-400 py-6 text-center mt-auto">
      <p>© 2026 devKobe24 Blog. All rights reserved.</p>
    </footer>
  </body>
</html>
