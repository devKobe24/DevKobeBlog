server:
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  profiles:
    active: dev

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

blog:
  site:
    # 사이트 base URL (sitemap 등용, 운영: https://devkobe-blog.com)
    url: ${BLOG_SITE_URL:http://localhost:8080}
  git:
    url: https://github.com/devKobe24/DevKobeBlog.git
    local-path: ./blog-data
    # 환경 변수 없으면 개발용 기본값 사용 (운영에서는 반드시 WEBHOOK_SECRET 설정)
    webhook-secret: ${WEBHOOK_SECRET:dev-webhook-secret}

cloud:
  aws:
    region:
      static: ap-northeast-2
    s3:
      bucket: devkobe-blog-images